name: Build Windows Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - neoding-demo

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: desktop/tauri
        run: npm install

      - name: Reset Cargo registry config
        shell: bash
        run: |
          rm -f ~/.cargo/config
          rm -f ~/.cargo/config.toml
          rm -f .cargo/config
          rm -f .cargo/config.toml
          rm -f desktop/tauri/.cargo/config
          rm -f desktop/tauri/.cargo/config.toml
          rm -f desktop/tauri/src-tauri/.cargo/config
          rm -f desktop/tauri/src-tauri/.cargo/config.toml
          rm -rf ~/.cargo/registry/index/*
          cargo --version

      - name: Prepare bundled backend
        working-directory: desktop/tauri
        shell: bash
        env:
          # Injected at build time from repository Secrets (Settings -> Secrets and
          # variables -> Actions). Keeps API keys out of git history while the
          # installed app still ships with them baked into bundled-backend/backend/.env.
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node scripts/prepare-backend.mjs

          # Write the bundled .env so the desktop app has built-in credentials.
          # Values come from GitHub Secrets; fall back to the public endpoints so
          # a build without secrets still succeeds (the app just lacks working keys).
          : "${ARK_BASE_URL:=https://ark.cn-beijing.volces.com/api/coding}"
          : "${ARK_MODEL:=ark-code-latest}"
          cat > bundled-backend/backend/.env <<EOF
          ANTHROPIC_API_KEY=${ARK_API_KEY}
          ANTHROPIC_BASE_URL=${ARK_BASE_URL}
          ANTHROPIC_MODEL=${ARK_MODEL}
          QUANTAGENT_TRIAL_API_KEY=${DEEPSEEK_API_KEY}
          EOF
          echo "Wrote bundled .env (key length: ${#ARK_API_KEY})"

          rm -rf src-tauri/bundled-backend
          cp -R bundled-backend src-tauri/bundled-backend
          ls -la bundled-backend
          ls -la src-tauri/bundled-backend
          test -f bundled-backend/python-runtime/python.exe
          bundled-backend/python-runtime/python.exe --version
          bundled-backend/python-runtime/python.exe -c "import sys; sys.path.insert(0, r'bundled-backend/python/site-packages'); import flask, requests; print('Bundled Python runtime OK')"

      - name: Smoke-test bundled Flask backend (desktop mode)
        working-directory: desktop/tauri
        shell: bash
        run: |
          # Start the bundled backend exactly like the Tauri shell does, then verify
          # /api/health returns desktop:true with the expected token. This catches
          # startup crashes (e.g. missing API keys) that a compile-only build misses.
          export QUANTAGENT_DESKTOP=1
          export QUANTAGENT_DESKTOP_TOKEN=quantagent-desktop-backend-v2
          export QUANTAGENT_FLASK_PORT=5099
          export PYTHONPATH="$PWD/bundled-backend/python/site-packages;$PWD/bundled-backend/backend"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONUNBUFFERED=1

          bundled-backend/python-runtime/python.exe bundled-backend/backend/web_interface.py > flask-smoke.log 2>&1 &
          FLASK_PID=$!
          echo "Started Flask PID=$FLASK_PID"

          ok=0
          for i in $(seq 1 60); do
            body=$(curl -s http://127.0.0.1:5099/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' \
               && echo "$body" | grep -q '"desktop":true' \
               && echo "$body" | grep -q '"token":"quantagent-desktop-backend-v2"'; then
              echo "Flask health check OK: $body"
              ok=1
              break
            fi
            if ! kill -0 "$FLASK_PID" 2>/dev/null; then
              echo "::error::Flask exited during smoke test"
              cat flask-smoke.log
              exit 1
            fi
            sleep 2
          done

          kill "$FLASK_PID" 2>/dev/null || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::Flask did not become healthy in time"
            cat flask-smoke.log
            exit 1
          fi

      - name: Build Tauri Windows app
        working-directory: desktop/tauri
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
        run: npm run build -- --verbose

      - name: Show build outputs
        shell: bash
        run: |
          echo "Listing likely Windows outputs:"
          find desktop/tauri/src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) | sort

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QuantAgent-Windows-Setup
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
